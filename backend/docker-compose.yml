version: '3.8'

services:
  web:
    build: .
    restart: always
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - CORS_ORIGINS=${CORS_ORIGINS:-https://madhav-vasani-dev.github.io,http://localhost:4200}
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:-https://madhav-vasani-dev.github.io/tradzo}
      - UPSTOX_REDIRECT_URI=${UPSTOX_REDIRECT_URI}
      - UPSTOX_CLIENT_ID=${UPSTOX_CLIENT_ID}
      - UPSTOX_CLIENT_SECRET=${UPSTOX_CLIENT_SECRET}
      - JAINAM_XTS_BASE_URL=${JAINAM_XTS_BASE_URL:-https://jtrade.jainam.in:5000}
      - JAINAM_XTS_SOURCE=${JAINAM_XTS_SOURCE:-WebAPI}
      - TOKEN_ENCRYPTION_KEY=${TOKEN_ENCRYPTION_KEY}
      - ENABLE_SCHEDULER=${ENABLE_SCHEDULER:-true}
      - FIREBASE_CREDENTIALS_JSON=${FIREBASE_CREDENTIALS_JSON}
      - KOTAK_EXPECTED_STATIC_IP=${KOTAK_EXPECTED_STATIC_IP:-}
      - KOTAK_DAILY_LOGIN_TIME=${KOTAK_DAILY_LOGIN_TIME:-08:45}
      - CRUDE_ENTRY_TIME=${CRUDE_ENTRY_TIME:-15:30}
      - CRUDE_EXIT_TIME=${CRUDE_EXIT_TIME:-23:24}
      - CRUDE_MIN_DAYS_TO_EXPIRY=${CRUDE_MIN_DAYS_TO_EXPIRY:-1}
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - BACKEND_DOMAIN=${BACKEND_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  caddy_data:
  caddy_config:
