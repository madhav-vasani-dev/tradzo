# fly.toml — Tradzo FastAPI Backend Fly.io deployment config
# App name: tradzo-backend (change this to match your chosen name on Fly.io)

app = "tradzo-backend"
primary_region = "bom"   # Mumbai (closest to IST / Indian market)

[build]

[env]
  PORT = "8080"
  HOST = "0.0.0.0"
  ENABLE_SCHEDULER = "true"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false    # CRITICAL: Never sleep — scheduler must always run
  auto_start_machines = true
  min_machines_running = 1      # Always keep at least 1 instance alive

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  size = "shared-cpu-1x"        # Free tier VM size
  memory = "256mb"
