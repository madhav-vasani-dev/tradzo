<p-dialog
  [visible]="visible"
  (visibleChange)="onVisibleChange($event)"
  [modal]="true"
  [header]="title"
  [closable]="!running"
  [closeOnEscape]="!running"
  [dismissableMask]="false"
  [style]="{ width: '450px', maxWidth: '95vw' }"
  styleClass="custom-confirm-dialog">

  <div class="confirm-content">{{ message }}</div>

  @if (running) {
    <div class="confirm-running" role="status" aria-live="polite">
      <span class="confirm-spinner" aria-hidden="true"></span>
      <span>{{ runningText }}</span>
    </div>
  }

  <ng-template pTemplate="footer">
    <div class="confirm-actions">
      <button type="button" class="confirm-btn-secondary" [disabled]="running" (click)="cancel()">
        {{ cancelText }}
      </button>
      <button type="button" class="confirm-btn-primary" [disabled]="running" (click)="confirm()">
        @if (running) {
          <span class="confirm-spinner dark" aria-hidden="true"></span>
        }
        {{ running ? runningText : confirmText }}
      </button>
    </div>
  </ng-template>
</p-dialog>
