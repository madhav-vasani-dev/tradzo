<div class="sidebar-container">
  <!-- Brand -->
  <div class="sidebar-header">
    <div class="logo-wrapper">
      <img src="Images/logo.jpeg" alt="Tradzo" class="brand-logo" />
      <span class="brand-text">Tradzo</span>
    </div>
  </div>

  <!-- Main navigation -->
  <div class="sidebar-menu">
    <div class="menu-section">
      <div class="section-label">Main</div>
      @for (item of mainMenuItems; track item.route) {
        <a [routerLink]="item.route" routerLinkActive="active" class="menu-item">
          <i [class]="item.icon"></i>
          <span>{{ item.label }}</span>
        </a>
      }
    </div>

    <!-- Admin section — only visible to admins -->
    @if (authService.isAdmin$ | async) {
      <div class="menu-section">
        <div class="section-label">Admin</div>
        @for (item of adminMenuItems; track item.route) {
          <a [routerLink]="item.route" routerLinkActive="active" class="menu-item admin-item">
            <i [class]="item.icon"></i>
            <span>{{ item.label }}</span>
          </a>
        }
      </div>
    }
  </div>

  <!-- Footer -->
  <div class="sidebar-footer">
    <div class="version-tag">v1.0 · Phase 1</div>
  </div>
</div>
