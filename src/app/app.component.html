<p-toast></p-toast>

@if (isAuthRoute) {
  <router-outlet></router-outlet>
} @else {
  <div class="layout" [class.desktop-sidebar-hidden]="!desktopSidebarVisible">
    <app-sidebar class="desktop-sidebar"></app-sidebar>

    <div class="main-content">
      <header class="header">
        <div class="header-left">
          <p-button icon="pi pi-bars" (onClick)="toggleSidebar()" class="menu-toggle" [text]="true" severity="secondary"></p-button>
          <span class="page-title">{{ pageTitle }}</span>
        </div>
        <div class="header-right">
          <p-button icon="pi pi-bell" [rounded]="true" [text]="true" severity="secondary"></p-button>
          
          <p-menu #profileMenu [model]="accountMenuItems" [popup]="true"></p-menu>
          <p-button icon="pi pi-user" [rounded]="true" [text]="true" severity="secondary" 
            (onClick)="profileMenu.toggle($event)"
            (mouseenter)="profileMenu.toggle($event)"></p-button>
        </div>
      </header>

      <p-drawer [(visible)]="sidebarVisible" position="left" [baseZIndex]="10000" styleClass="mobile-drawer">
        <app-sidebar></app-sidebar>
      </p-drawer>

      <main class="page-content">
        <router-outlet></router-outlet>
      </main>
    </div>
  </div>
}
